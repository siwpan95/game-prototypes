name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install SDL2 (pygame dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0 libsdl2-ttf-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0

      - name: Install Python dependencies
        run: pip install pygame

      - name: Run tests
        run: python -m pytest -q --tb=short
