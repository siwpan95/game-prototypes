[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-adventure"
version = "0.1.0"
description = "Puzzle-driven text adventure (pygame client + headless puzzle service + Cordis host)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "siwpan" }]
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# Two different clients, two names: the pygame desktop build and the terminal
# client. Giving the CLI the generic `text-adventure` name would hide that this
# project has more than one front end.
text-adventure-cli = "puzzle_service.cli:main_cli"
text-adventure-pygame-zh = "shared.cli:main_zh"
text-adventure-pygame-en = "shared.cli:main_en"

[tool.setuptools]
# Explicit package list: these are the import roots the game and the puzzle
# service actually use. Keeping it explicit stops setuptools from guessing.
#
# `gameplay_pool` is the unified implementation (M5): one copy of the puzzle logic,
# with the language as a constructor argument. The directories below it are the
# pygame clients (engine/ui/events/domain) — legacy front ends that are scheduled
# for retirement, not part of the unified pool.
packages = [
  "shared",
  "gameplay_pool",
  "puzzle_service",
  "text_adventure.gameplay_pool",
  "text_adventure_zh.gameplay_pool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
