[pytest]
# Test root / collection config for the Text FPS game.
# conftest.py (tests/conftest.py) injects the project root into sys.path so that
# test modules can do `from models.xxx import ...` / `from core.xxx import ...`.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Run quiet by default; CI can override with `pytest -v tests/`.
addopts = -q
# Stop after the first failure when running locally for faster feedback.
# (Comment out for full CI runs.)
