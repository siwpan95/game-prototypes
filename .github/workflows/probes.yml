name: Probes（集成探针 · 回归门禁）

# 回归门禁：任何 push / PR 都跑一遍 MC1 + MC2 + 统一产品探针。
# 任一探针套件失败 → launcher.py --probes 退出码非 0 → CI 失败，阻断合入。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  probes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pygame-ce 轮子通常自带 SDL2；此步安装系统 SDL 共享库作为兜底，
      # 即便失败也不阻断构建（headless 时 SDL_VIDEODRIVER=dummy 即可）。
      - name: Install system SDL libs (headless pygame 兜底)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0
        continue-on-error: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./allin_engine[all]
          pip install pytest

      # headless 运行：禁用视频/音频设备，避免 CI 无显示环境崩溃。
      - name: Run probe suite（回归门禁）
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python launcher.py --probes
